<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon_32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="%PUBLIC_URL%/favicon_512.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6B6EF9" />
    <meta name="description" content="트렌디한 팝업스토어·전시회 예약 플랫폼" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon_180.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
    <!-- 카카오맵 SDK: CRA는 index.html script src 안의 환경변수를 치환하지 않으므로 동적으로 주입 -->
    <script>
      (function () {
        var key = "%REACT_APP_KAKAO_MAP_APP_KEY%";
        if (!key || key.indexOf("REACT_APP") !== -1) return;
        var script = document.createElement("script");
        script.type = "text/javascript";
        script.src =
          "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
          key +
          "&libraries=services&autoload=false";
        document.head.appendChild(script);
      })();
    </script>
    <title>Trendy Spot</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
